name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and test
        run: |
          npm ci || npm install
          npm test

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version | tr -d 'v')
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('gladys-assistant-integration.json', 'utf8'));
            m.version = '${VERSION}';
            m.docker_image = '${IMAGE}';
            fs.writeFileSync('gladys-assistant-integration.json', JSON.stringify(m, null, 2) + '\n');
          "
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Validate the manifest
        run: npx --yes github:GladysAssistant/integration-store .

      - name: Commit and tag
        run: |
          git add package.json package-lock.json gladys-assistant-integration.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.bump.outputs.image }}
            ghcr.io/${{ github.repository }}:latest
